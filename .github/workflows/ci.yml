name: ci
# Upgrade safety net (see TESTING.md). Every PR (incl. Dependabot), main, and agent/** branches
# (an agent gets CI without opening a PR). Uses no secret and pushes nothing.
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: server tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: ['26']  # Node 20 is EOL; 26 LTS only (pazka/hosh-management#5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test --test-reporter=spec test/server.test.js

  smoke:
    name: container smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: henryivrevival:smoke
      - name: Node runtime guardrail (CVE-2026-111497, pazka/hosh-management#5)
        run: bash scripts/check-node-version.sh henryivrevival:smoke
      - name: guardrail bites (an unpatched Node image must be rejected)
        run: '! bash scripts/check-node-version.sh node:24.21.0-alpine'
      - run: bash scripts/smoke.sh henryivrevival:smoke
      - name: legacy compose (the box's current compose, unchanged)
        run: bash scripts/compose-smoke.sh legacy henryivrevival:smoke
