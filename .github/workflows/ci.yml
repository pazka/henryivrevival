name: ci
# Upgrade safety net (see TESTING.md). Every PR (incl. Dependabot), main, and agent/** branches
# (an agent gets CI without opening a PR). Uses no secret and pushes nothing.
on:
  pull_request:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: server tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: ['26']  # Node 20 is EOL; 26 LTS only (pazka/hosh-management#5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test --test-reporter=spec test/server.test.js test/log.test.js

  smoke:
    name: container smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: henryivrevival:smoke
      - name: Node runtime guardrail (CVE-2026-111497, pazka/hosh-management#5)
        run: bash scripts/check-node-version.sh henryivrevival:smoke
      - name: guardrail bites (an unpatched Node image must be rejected)
        run: '! bash scripts/check-node-version.sh node:24.21.0-alpine'
      - run: bash scripts/smoke.sh henryivrevival:smoke
      - name: legacy compose (the box's current compose, unchanged)
        run: bash scripts/compose-smoke.sh legacy henryivrevival:smoke
      - name: hosh-deploy compose (docker-compose.example.yml, register validation, healthcheck, POST_DEPLOY)
        run: bash scripts/compose-smoke.sh template henryivrevival:smoke

  visual:
    # Visual regression (hosh-management AGENTS.md §3, use cases in TESTING.md "Visual use cases"): the built
    # image runs as docker-compose.example.yml does, against a fake OpenAI (fixed text and silent mp3) on a docker
    # network of this runner, with a dummy key; the runner's Chrome (DevTools protocol, the image's own node, no
    # package) shoots every case at 1400 / 1024 / 390 against visual/baseline/. Every host but henry.test
    # resolves to nothing in Chrome.
    name: visual regression
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: henryivrevival:smoke
      # A failing shot is also printed in this log (VISUAL-PNG lines): visual/from-log.mjs writes it back as a file.
      - name: visual regression (screenshots vs baselines)
        run: VISUAL_PRINT_NEW=1 CHROME="$(command -v google-chrome)" OUT=visual/out bash visual/run.sh henryivrevival:smoke
      - name: upload visual shots, diffs and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-${{ github.sha }}
          path: visual/out/
          retention-days: 14
