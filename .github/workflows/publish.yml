name: Docker Image CI

# Legacy Docker Hub image (pazka/henryivrevival:latest); the box uses ghcr (deploy.yml / release.yml).
# PRs (incl. Dependabot, which gets no Actions secrets) only build; only a push to main logs in and pushes.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  buildnpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build and load locally first; the Node guardrail must pass before anything is pushed.
      - name: Build Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: pazka/henryivrevival:latest

      - name: Node runtime guardrail (blocks the push of an EOL/unpatched Node, pazka/hosh-management#5)
        run: bash scripts/check-node-version.sh pazka/henryivrevival:latest

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push pazka/henryivrevival:latest
