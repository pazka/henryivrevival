# Read ONCE by `hosh-deploy register henryivrevival` on the box (box standard, Decision #16), which
# validates the compose hardening and pins the result in /etc/hosh-deploy/apps/henryivrevival.conf.
# Changing this file in the repo changes nothing on the box until someone re-registers there.
SERVICE=henryivrevival
IMAGE_REPO=ghcr.io/pazka/henryivrevival
IMAGE_VAR=APP_IMAGE
ENV_FILE=henryivrevival.env
HOST=henryivrevival.hosh.it
BIND=127.0.0.1:9139
HEALTH=/healthz
# Capability smoke run INSIDE the container after each deploy (argv, no shell; non-zero ⇒ auto-rollback).
# Never calls OpenAI: /healthz (key set, never shown; static files; writable /tmp), page + assets, /chat/init,
# POST /chat, mp3 route, /chat/send guards (400 / 403 / 413, refused before OpenAI), dotfiles 404.
POST_DEPLOY=/usr/local/bin/node /usr/src/app/check/smoke.js http://127.0.0.1:8000
REPO=pazka/henryivrevival
